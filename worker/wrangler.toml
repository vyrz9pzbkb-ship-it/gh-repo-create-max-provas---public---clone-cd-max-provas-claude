# Worker do Coach do Max Provas — instruções de deploy no README principal.
name = "max-provas-coach"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Origem autorizada a chamar o Worker: o domínio do site no GitHub Pages (sem barra no fim).
# Para testar localmente, acrescente separado por vírgula: "https://…github.io,http://localhost:8000"
ALLOWED_ORIGIN = "https://vyrz9pzbkb-ship-it.github.io"

# Limites de uso: mensagens do chat por IP/hora e buscas na web por utilizador/dia.
# Crie com: npx wrangler kv namespace create COACH_KV  — e cole aqui o id devolvido.
[[kv_namespaces]]
binding = "COACH_KV"
id = "COLE_AQUI_O_ID_DO_KV"

# Secret (não fica no repositório): npx wrangler secret put ANTHROPIC_API_KEY
