<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Max Provas</title>
  <meta name="description" content="Provas de corrida, triatlo, ciclismo e natação no mundo todo.">

  <!-- PWA / iOS -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f6f5f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111015" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Max Provas">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">

  <link rel="stylesheet" href="css/styles.css?v=9">

  <script>
    // Versão da app: igual a CACHE_VERSION (sw.js), MAX_PROVAS_APP_BUILD (js/app.js) e ao ?v= dos
    // scripts/CSS abaixo (o ?v= muda o URL, para o browser não reutilizar a cópia antiga da cache HTTP).
    // Este HTML vem sempre da rede; se um service worker antigo servir um app.js de outra
    // versão, apaga as caches e recarrega uma vez, para não misturar ficheiros.
    window.MAX_PROVAS_BUILD = 'v9';
    document.addEventListener('DOMContentLoaded', function () {
      if (window.MAX_PROVAS_APP_BUILD === window.MAX_PROVAS_BUILD) return;
      try {
        if (sessionStorage.getItem('maxprovas.recarregado') === window.MAX_PROVAS_BUILD) return;
        sessionStorage.setItem('maxprovas.recarregado', window.MAX_PROVAS_BUILD);
      } catch (e) { return; }
      // Remove o service worker antigo e as caches dele; o app.js volta a registar o sw.js novo.
      var limpar = window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }) : Promise.resolve();
      var remover = navigator.serviceWorker ? navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }) : Promise.resolve();
      Promise.all([limpar, remover]).then(function () { location.reload(); }, function () { location.reload(); });
    });
  </script>
</head>
<body>
  <header class="topbar">
    <h1 id="view-title">Provas</h1>
    <p id="view-subtitle" class="subtitle"></p>
  </header>

  <main id="view" class="view" aria-live="polite">
    <p class="empty">A carregar…</p>
  </main>

  <nav class="tabbar" aria-label="Navegação principal">
    <a href="#provas" data-tab="provas"><span aria-hidden="true">🏁</span>Provas</a>
    <a href="#temporada" data-tab="temporada"><span aria-hidden="true">📈</span>Temporada</a>
    <a href="#coach" data-tab="coach"><span aria-hidden="true">🧭</span>Coach</a>
    <a href="#historico" data-tab="historico"><span aria-hidden="true">🏅</span>Histórico</a>
  </nav>

  <dialog id="country-sheet" class="sheet" aria-labelledby="sheet-title">
    <div class="sheet-head">
      <div>
        <p class="sheet-step">Passo 1 · País</p>
        <h2 id="sheet-title">Onde quer competir?</h2>
      </div>
      <button type="button" class="sheet-x" data-close aria-label="Fechar">✕</button>
    </div>
    <div class="sheet-body"></div>
    <div class="sheet-foot">
      <button type="button" class="btn" data-clear>Limpar</button>
      <button type="button" class="btn primary" data-apply>Ver provas</button>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="js/config.js?v=9" defer></script>
  <script src="js/app.js?v=9" defer></script>
  <script src="js/coach.js?v=9" defer></script>
  <script src="js/chat.js?v=9" defer></script>
</body>
</html>
